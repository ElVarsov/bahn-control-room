# Passes at once for changes in your own lane. If a PR touches the other
# person's folders (or a shared path), it waits for their approval.
# Rules: .github/lanes.json. Required on main by branch protection.
name: lane-guard

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  pull_request_review:
    types: [submitted, dismissed]

permissions:
  contents: read
  pull-requests: read

jobs:
  lane-guard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          sparse-checkout: .github/lanes.json
          sparse-checkout-cone-mode: false
      - uses: actions/github-script@v7
        with:
          script: |
            const fs = require("fs")
            // Rules come from the base branch, so a PR cannot loosen them for itself.
            const { rules } = JSON.parse(fs.readFileSync(".github/lanes.json", "utf8"))
            const pr = context.payload.pull_request
            const author = pr.user.login
            const { owner, repo } = context.repo

            const files = await github.paginate(github.rest.pulls.listFiles, { owner, repo, pull_number: pr.number, per_page: 100 })
            const paths = files.flatMap((f) => [f.filename, f.previous_filename].filter(Boolean))

            // Who must approve, and because of which files.
            const needed = new Map()
            for (const path of paths) {
              const rule = rules.find((r) => path === r.path || path.startsWith(r.path))
              if (!rule) continue
              const others = rule.owners.filter((o) => o.toLowerCase() !== author.toLowerCase())
              const mustApprove = rule.shared || !rule.owners.some((o) => o.toLowerCase() === author.toLowerCase())
              if (!mustApprove) continue
              for (const person of others) {
                if (!needed.has(person)) needed.set(person, [])
                needed.get(person).push(path)
              }
            }

            if (needed.size === 0) {
              core.info(`Only ${author}'s own lane or unowned files. No approval needed.`)
              return
            }

            // Latest review per person counts; a later "changes requested" cancels an approval.
            const reviews = await github.paginate(github.rest.pulls.listReviews, { owner, repo, pull_number: pr.number, per_page: 100 })
            const latest = new Map()
            for (const review of reviews) {
              if (review.state === "COMMENTED") continue
              latest.set(review.user.login.toLowerCase(), review.state)
            }

            const missing = [...needed.entries()].filter(([person]) => latest.get(person.toLowerCase()) !== "APPROVED")
            for (const [person, list] of needed) {
              core.info(`${person} must approve (${list.length} file(s)): ${list.slice(0, 10).join(", ")}${list.length > 10 ? " …" : ""}`)
            }
            if (missing.length > 0) {
              core.setFailed(`Waiting for approval from ${missing.map(([p]) => "@" + p).join(" and ")}: this PR changes files in their lane.`)
            } else {
              core.info("All needed approvals are in.")
            }
